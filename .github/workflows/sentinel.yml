name: Repo Sentinel

on:
  push:
  pull_request:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - name: Scan repository
        run: sentinel . --format sarif --output sentinel.sarif --fail-on high
      - name: Upload SARIF
        if: always() && (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: sentinel.sarif
      - name: Archive SARIF report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repo-sentinel-sarif
          path: sentinel.sarif
          if-no-files-found: ignore
