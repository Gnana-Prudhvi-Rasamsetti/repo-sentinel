name: False positive
description: Report a Repo Sentinel finding that does not apply to the code
title: "[False positive]: "
labels: ["scanner-feedback"]
body:
  - type: input
    id: rule
    attributes:
      label: Rule ID
      placeholder: SEC006
    validations:
      required: true
  - type: input
    id: language
    attributes:
      label: Language and relevant framework
    validations:
      required: true
  - type: textarea
    id: finding
    attributes:
      label: Finding and sanitized code excerpt
      description: Remove credentials, personal data, and private source before posting.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Why this is a false positive
    validations:
      required: true
